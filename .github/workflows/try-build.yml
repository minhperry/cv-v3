name: Build the app

on:
  pull_request:
    paths:
      - 'src/**'
      - '*.js'
      - '*.json'
    types: [opened, synchronize, reopened]

jobs:
  try-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build
