@let proj = project();
<div class="pc-root" [class.pc-right]="textRight()">
  <div class="pc-panel pc-img">
    @if (proj.imgUrl) {
      <img class="img" [src]="proj.imgUrl" />
    } @else {
      <div>
        Kys no image here
      </div>
    }
  </div>

  <div class="pc-panel pc-content">
    <h2>{{ proj.titleKey | translate }}</h2>
    <p>{{ proj.descKey | translate }}</p>

    <span>
      @if (proj.links) {
        @for (link of proj.links; track link.url) {
          <p-link [to]="link.url" [label]="link.label" />
        }
      }
    </span>
  </div>

</div>
